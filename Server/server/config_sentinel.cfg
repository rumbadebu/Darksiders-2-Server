# DS2 sentinel config oracle - see which key names the game actually honors.
# Each candidate endpoint key gets a UNIQUE sentinel hostname; whichever one
# the game resolves (visible in the proxy log via getaddrinfo hook) reveals
# the key name. Sentinels s1..s10 map back to candidate keys:
#   s1 = [thqc-gds] host        s2 = [thqc-gds] endpoint
#   s3 = [thqc-gds] server      s4 = [thqc-gds] url
#   s5 = [_shared] thqc-gds     s6 = [_shared] gds
#   s7 = [_defaults] gds        s8 = bare  gds
#   s9 = Telemetry value        s10 = TelemetryTag value
# Known-good keys included to keep the document realistic.

[_defaults]
PC.UsingSteam=true
Language=en
Game=en
DeveloperMode=Debug
ScreenWidth=1280
ScreenHeight=720
Fullscreen=false
VSync=false
Renderer=D3D9
gds=s7-ds2cfg.thqconnect.com

[_shared]
thqc-gds=s5-ds2cfg.thqconnect.com
gds=s6-ds2cfg.thqconnect.com
TelemetryEnabled=true
Telemetry=s9-ds2cfg.thqconnect.com
TelemetryTag=Release

[thqc-gds]
host=s1-ds2cfg.thqconnect.com
endpoint=s2-ds2cfg.thqconnect.com
server=s3-ds2cfg.thqconnect.com
url=s4-ds2cfg.thqconnect.com
scheme=https
path=/rpc
prefix=/gds/

gds=s8-ds2cfg.thqconnect.com
THQConnect.LocalizationLanguage=en
DemoMode=false
ShowTitleScreen=true
